version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: free_ticket_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: free_ticket
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backup.sql:/docker-entrypoint-initdb.d/backup.sql

volumes:
  mysql_data: