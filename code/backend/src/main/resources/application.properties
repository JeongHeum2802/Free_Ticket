spring.application.name=backend

#DB Settings
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.orm.jdbc.bind=trace
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

# Temporary service SQL markers; set SERVICE_LOG_LEVEL=INFO to disable.
logging.level.wamddu.backend.event.service=${SERVICE_LOG_LEVEL:DEBUG}
logging.level.wamddu.backend.user.service=${SERVICE_LOG_LEVEL:DEBUG}
logging.level.wamddu.backend.order.service=${SERVICE_LOG_LEVEL:DEBUG}
logging.level.wamddu.backend.payment.service=${SERVICE_LOG_LEVEL:DEBUG}

SECRET_KEY=${JWT_SECRET}
EXPIRATION=${JWT_EXPIRATION}

# Toss Payments
toss.secret-key=${TOSS_SECRET_KEY:}
toss.api-base-url=${TOSS_API_BASE_URL:https://api.tosspayments.com}

# Unfinished payments: scan every 30s, retry every 2m, then require manual review.
payment.recovery.enabled=${PAYMENT_RECOVERY_ENABLED:true}
payment.recovery.delay-ms=${PAYMENT_RECOVERY_DELAY_MS:30000}
payment.recovery.retry-delay-ms=${PAYMENT_RECOVERY_RETRY_DELAY_MS:120000}
payment.recovery.max-attempts=${PAYMENT_RECOVERY_MAX_ATTEMPTS:20}
